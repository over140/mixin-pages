<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mixin-pages</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #18202a;
      --muted: #607080;
      --accent: #2f6fed;
      --border: #d9e1ec;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eef3ff 0%, var(--bg) 100%);
      color: var(--text);
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 20px 64px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 18px 50px rgba(29, 54, 87, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
    }

    p {
      margin: 0 0 16px;
      line-height: 1.6;
      color: var(--muted);
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }

    ul {
      padding-left: 20px;
      margin: 20px 0 0;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>mixin-pages</h1>
      <p>Static pages for quick tools, demos, and experiments.</p>
      <ul>
        <li><a href="./helloworld.html">Hello World test page</a></li>
      </ul>
    </section>
  </main>
</body>
</html>
