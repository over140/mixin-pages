<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mixin Demo</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">Mixin Pages</p>
      <h1>JS Bridge 与 Schema Interactions</h1>
      <p class="summary">从 `mixbot/web/src/demo` 迁移出来的静态测试页，用于验证分享、Schema 唤起和客户端 JS Bridge。</p>
    </div>
    <a class="back-link" href="../index.html">返回首页</a>
  </header>

  <section class="status-panel">
    <div>
      <span class="status-label">客户端环境</span>
      <strong id="platform-label">Browser</strong>
    </div>
    <div>
      <span class="status-label">Conversation ID</span>
      <strong id="conversation-label">未检测到</strong>
    </div>
    <button id="refresh-context" type="button">刷新 Context</button>
  </section>

  <nav class="tabs" aria-label="demo tabs">
    <button class="tab active" data-tab="share" type="button">通用分享</button>
    <button class="tab" data-tab="schema" type="button">Schema 唤起</button>
    <button class="tab" data-tab="js" type="button">JS 唤起</button>
  </nav>

  <main id="panels">
    <section class="panel active" data-panel="share">
      <table>
        <tbody id="share-body"></tbody>
      </table>
    </section>

    <section class="panel" data-panel="schema">
      <table>
        <tbody id="schema-body"></tbody>
      </table>
    </section>

    <section class="panel" data-panel="js">
      <table>
        <tbody id="js-body"></tbody>
      </table>
    </section>
  </main>

  <div id="toast" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
